
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbox</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <section id="loginScreen">
    <div class="loginBox">
      <h1>Chatbox</h1>
      <p>Gerçek zamanlı sohbet</p>

      <input id="username" placeholder="Kullanıcı adın">
      <input id="room" placeholder="Oda adı" value="Genel">

      <button id="joinButton">Sohbete Katıl</button>
    </div>
  </section>

  <section id="chatScreen" class="hidden">
    <header>
      <div>
        <h2>Chatbox</h2>
        <span id="roomTitle">Genel</span>
      </div>
      <button id="leaveButton">Çık</button>
    </header>

    <main>
      <aside>
        <h3>Çevrimiçi</h3>
        <ul id="userList"></ul>
      </aside>

      <div class="chatArea">
        <div id="messages"></div>

        <form id="messageForm">
          <input id="messageInput" placeholder="Mesaj yaz..." autocomplete="off">
          <button type="submit">Gönder</button>
        </form>
      </div>
    </main>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
