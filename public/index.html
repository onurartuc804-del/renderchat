<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Chatbox</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section id="loginScreen" class="login-card">
      <div class="brand">▣ Chatbox</div><p>Gerçek zamanlı oda sohbeti</p>
      <label>Kullanıcı adı</label><input id="usernameInput" maxlength="24" placeholder="Kullanıcı adın">
      <label>Oda adı</label><input id="roomInput" maxlength="32" placeholder="Örn. sohbet-1">
      <button id="joinButton" class="primary">Odaya katıl</button>
    </section>
    <section id="chatScreen" class="chat-screen hidden">
      <header class="topbar"><div class="brand">▣ Chatbox <small id="roomTitle"></small></div>
        <div class="top-actions"><button id="youtubeButton" class="icon-btn" title="YouTube paylaş" aria-label="YouTube paylaş">▶</button><button id="roomMenuButton" class="icon-btn" title="Oda menüsü" aria-label="Oda menüsü">♧</button></div>
      </header>
      <div class="main-area"><aside class="sidebar"><h3>Odada</h3><div id="usersList"></div><div id="voiceStatus">Sesli sohbet kapalı</div><button id="voiceButton">🎙 Sesli sohbete katıl</button><button id="leaveButton" class="muted">Odadan ayrıl</button></aside>
        <section class="conversation"><div id="messages" class="messages"></div><div class="composer"><button id="gifButton" class="gif-button">GIF</button><input id="messageInput" placeholder="Mesaj yaz..." maxlength="1500"><button id="sendButton" class="primary">Gönder</button></div></section>
      </div>
    </section>
  </main>

  <div id="roomMenu" class="popup hidden"><button id="createRoomOption">＋ Oda oluştur</button><button id="joinRoomOption">↪ Odaya katıl</button><button id="roomInfoOption">Oda bilgisi</button></div>
  <div id="roomModal" class="modal hidden"><div class="modal-card"><button class="modal-close" data-close="roomModal">×</button><h2 id="roomModalTitle">Oda oluştur</h2><label>Oda adı</label><input id="modalRoomInput" maxlength="32" placeholder="Oda adı"><button id="modalRoomSubmit" class="primary">Oluştur</button></div></div>
  <div id="youtubeModal" class="modal hidden"><div class="modal-card"><button class="modal-close" data-close="youtubeModal">×</button><h2>YouTube paylaş</h2><p>Bu özellik yalnızca oda sahibi tarafından kullanılabilir.</p><label>YouTube URL</label><input id="youtubeUrlInput" placeholder="https://youtu.be/..." autocomplete="url"><button id="youtubeShareButton" class="primary">Odada aç</button><div id="youtubeError" class="error"></div></div></div>
  <div id="gifModal" class="modal hidden"><div class="modal-card gif-card"><button class="modal-close" data-close="gifModal">×</button><h2>Giphy GIF</h2><div class="gif-search"><input id="gifSearchInput" placeholder="GIF ara"><button id="gifSearchButton" class="primary">Ara</button></div><div id="gifResults" class="gif-results"></div></div></div>
  <div id="youtubePlayer" class="video-window hidden"><button id="youtubeCloseButton" class="video-close" title="Videoyu kapat">×</button><div id="youtubeFrameWrap"></div></div>
  <div id="toast" class="toast hidden"></div>
  <audio id="roomSound" preload="auto"></audio>
  <script src="/socket.io/socket.io.js"></script><script src="app.js"></script>
</body></html>
