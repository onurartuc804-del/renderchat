
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chatbox</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#111827;color:#fff;font-family:Arial,sans-serif}
button,input{font:inherit;border:0;border-radius:9px;padding:11px}
button{background:#2563eb;color:white;cursor:pointer}
button:hover{filter:brightness(1.12)}
input{background:#374151;color:white;min-width:0}
.hidden{display:none!important}
.container{max-width:1000px;margin:auto;padding:14px}
.panel{background:#1f2937;border-radius:14px;padding:16px;margin-bottom:14px}
#loginScreen{max-width:440px;margin:10vh auto}
#loginScreen input{width:100%;margin:8px 0}
#loginScreen button{width:100%}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar button{white-space:nowrap}
.gif-search{display:flex;gap:6px;flex:1;min-width:200px}
.gif-search input{flex:1;width:100%}
#messages{height:45vh;min-height:220px;overflow:auto;background:#111827;padding:12px;border-radius:10px}
.message{background:#374151;padding:9px;border-radius:9px;margin-bottom:8px;overflow-wrap:anywhere}
.message-header{display:flex;justify-content:space-between;gap:10px;margin-bottom:5px}
.message-header small{color:#9ca3af}
.message-content{white-space:pre-wrap}
.chat-gif{display:block;max-width:100%;max-height:280px;border-radius:8px}
.send-row{display:flex;gap:8px;margin-top:10px}
.send-row input{flex:1;width:100%}
#gifResults{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.gif-result{padding:0;overflow:hidden;background:#374151}
.gif-result img{display:block;width:100%;height:110px;object-fit:cover}
#voiceScreen h2{margin-top:0}
#voiceRoomUsers,#voiceMessages{background:#111827;padding:10px;border-radius:9px;margin:10px 0}
#voiceMessages{height:140px;overflow:auto}
#voiceChatPanel{margin-top:12px}
#voiceAudioContainer{display:none}
#youtubeModal{position:fixed;inset:0;background:#000b;z-index:1000;display:flex;align-items:center;justify-content:center;padding:12px}
.youtube-window{width:min(900px,100%);background:#111827;border:1px solid #374151;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px #0008}
.youtube-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#1f2937}
.youtube-head h3{margin:0;font-size:16px}
.youtube-close{background:#dc2626;font-size:22px;padding:4px 13px}
.youtube-frame{width:100%;aspect-ratio:16/9;background:#000}
.youtube-frame iframe{width:100%;height:100%;border:0}
#youtubeInputModal{position:fixed;inset:0;background:#000b;z-index:1001;display:flex;align-items:center;justify-content:center;padding:14px}
.url-box{width:min(500px,100%);background:#1f2937;padding:18px;border-radius:14px}
.url-box input{width:100%;margin:10px 0}
.url-actions{display:flex;justify-content:flex-end;gap:8px}
.danger{background:#dc2626}
@media(max-width:600px){
 .container{padding:8px}
 .panel{padding:12px}
 #gifResults{grid-template-columns:repeat(2,minmax(0,1fr))}
 .toolbar{align-items:stretch}
 .gif-search{min-width:100%;order:2}
}
</style>
</head>

<body>
<div class="container">

<section id="loginScreen" class="panel">
<h1>Chatbox</h1>
<p>Kullanıcı adını kaydet ve sohbete katıl.</p>
<input id="usernameInput" maxlength="24" placeholder="Kullanıcı adın">
<button id="joinButton">Kaydet ve Sohbete Katıl</button>
</section>

<main id="mainScreen" class="hidden">

<section class="panel">
<div class="toolbar">
<button id="voiceCreateButton">＋ Oda Oluştur</button>
<input id="voiceRoomNameInput" placeholder="Oda sahibinin adı" style="flex:1;min-width:120px">
<button id="voiceJoinButton">Odaya Katıl</button>
<button id="youtubeOpenButton" title="YouTube video paylaş">▶ URL</button>

<div class="gif-search">
<input id="gifSearchInput" placeholder="GIF ara...">
<button id="gifSearchButton">GIF</button>
</div>
</div>

<div id="gifResults" class="hidden"></div>
</section>

<section id="chatScreen" class="panel">
<h2>Genel Sohbet</h2>
<div id="messages"></div>
<div class="send-row">
<input id="messageInput" placeholder="Mesajını yaz...">
<button id="sendButton">Gönder</button>
</div>
</section>

<section id="voiceScreen" class="panel">
<h2>Sesli Oda</h2>
<h3 id="voiceRoomTitle">Henüz bir odada değilsin</h3>
<p id="voiceRoomStatus">Bir oda oluştur veya katıl.</p>
<div id="voiceRoomUsers">Odada kimse yok</div>

<div class="toolbar">
<button id="voiceMuteButton">Mikrofonu Kapat</button>
<button id="voiceChatToggleButton">Oda Sohbeti</button>
<button id="voiceLeaveButton" class="danger">Odadan Çık</button>
</div>

<div id="voiceChatPanel" class="hidden">
<h3>Oda Mesajları</h3>
<div id="voiceMessages"></div>
<div class="send-row">
<input id="voiceMessageInput" placeholder="Odaya mesaj yaz...">
<button id="voiceMessageSendButton">Gönder</button>
</div>
</div>
<div id="voiceAudioContainer"></div>
</section>
</main>
</div>

<!-- YouTube URL giriş penceresi -->
<div id="youtubeInputModal" class="hidden">
<div class="url-box">
<h3>YouTube videosu paylaş</h3>
<p>Oda sahibi YouTube bağlantısını buraya yapıştırabilir.</p>
<input id="youtubeUrlInput" placeholder="https://youtube.com/watch?v=...">
<div class="url-actions">
<button id="youtubeCancelButton" class="danger">İptal</button>
<button id="youtubePlayButton">Videoyu Aç</button>
</div>
</div>
</div>

<!-- YouTube video penceresi -->
<div id="youtubeModal" class="hidden">
<div class="youtube-window">
<div class="youtube-head">
<h3 id="youtubeVideoTitle">Oda YouTube Videosu</h3>
<button id="youtubeCloseButton" class="youtube-close" aria-label="Videoyu kapat">×</button>
</div>
<div class="youtube-frame">
<iframe id="youtubeFrame"
src=""
title="YouTube video player"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
allowfullscreen></iframe>
</div>
</div>
</div>

<audio id="joinSound" preload="auto" src="/sounds/room-open.mp3"></audio>
<audio id="leaveSound" preload="auto" src="/sounds/room-close.mp3"></audio>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
<script src="voice.js"></script>
</body>
</html>
