<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbox</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <section id="joinScreen" class="join-screen">
    <form id="joinForm" class="join-card">
      <h1>Chatbox</h1>
      <p>Gerçek zamanlı sohbet</p>
      <input id="nameInput" maxlength="24" placeholder="Kullanıcı adın" required>
      <button type="submit">Sohbete gir</button>
    </form>
  </section>

  <main id="chatScreen" class="chat-screen hidden">
    <header class="topbar">
      <div class="brand">Chatbox</div>

      <div class="top-actions">
        <button id="createVoiceBtn" title="Sesli oda oluştur">🎙️ Oda oluştur</button>
        <button id="joinVoiceBtn" title="Sesli odaya katıl">🔊 Odaya katıl</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <h3>Çevrimiçi <span id="onlineCount">0</span></h3>
        <ul id="userList"></ul>
      </aside>

      <section class="chat-area">
        <div id="messages" class="messages"></div>

        <form id="messageForm" class="message-form">
          <button type="button" id="gifButton">GIF</button>
          <input id="messageInput" placeholder="Mesaj yaz..." autocomplete="off">
          <button type="submit">Gönder</button>
        </form>
      </section>
    </div>
  </main>

  <!-- GIF penceresi -->
  <div id="gifModal" class="modal hidden">
    <div class="modal-card">
      <button id="closeGif" class="close-btn">✕</button>
      <h2>GIF ara</h2>

      <form id="gifSearchForm">
        <input id="gifQuery" placeholder="GIF ara..." autocomplete="off">
        <button type="submit">Ara</button>
      </form>

      <div id="gifResults" class="gif-results"></div>
    </div>
  </div>

  <!-- Sesli oda penceresi -->
  <section id="voicePanel" class="voice-panel hidden">
    <header class="voice-header">
      <div>
        <strong id="voiceRoomTitle">Sesli oda</strong>
        <small id="voiceStatus">Bağlanıyor...</small>
      </div>

      <div class="voice-header-buttons">
        <button id="voiceTextToggle" title="Oda sohbeti">💬</button>
        <button id="voiceCloseBtn" title="Odadan ayrıl">✕</button>
      </div>
    </header>

    <div id="voicePeers" class="voice-peers"></div>

    <div class="voice-controls">
      <button id="voiceMicBtn">🎙️ Mikrofon açık</button>
      <button id="voiceLeaveBtn" class="leave-button">Odadan ayrıl</button>
    </div>

    <div id="voiceTextPanel" class="voice-text-panel hidden">
      <div id="voiceMessages" class="voice-messages"></div>

      <form id="voiceMessageForm" class="voice-message-form">
        <input id="voiceMessageInput" placeholder="Odaya mesaj yaz..." maxlength="500">
        <button type="submit">Gönder</button>
      </form>
    </div>
  </section>

  <audio id="joinSound" src="/sounds/join.m4a" preload="auto"></audio>
  <audio id="leaveSound" src="/sounds/leave.m4a" preload="auto"></audio>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
  <script src="/voice.js"></script>
</body>
</html>
