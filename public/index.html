
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbox</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101218;
      color: white;
    }

    .hidden {
      display: none !important;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 11px 15px;
      background: #5865f2;
      color: white;
    }

    input {
      min-width: 0;
      padding: 12px;
      border: 1px solid #343944;
      border-radius: 10px;
      background: #20232b;
      color: white;
      outline: none;
    }

    #loginScreen {
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 380px;
      background: #191c24;
      padding: 25px;
      border-radius: 18px;
    }

    .login-box h1 {
      text-align: center;
      color: #7280ff;
    }

    .login-box input,
    .login-box button {
      width: 100%;
      margin-top: 12px;
    }

    #mainScreen {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      height: 60px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: #191c24;
      border-bottom: 1px solid #30343e;
    }

    .brand {
      font-weight: bold;
      font-size: 20px;
      color: #8290ff;
      margin-right: auto;
    }

    .icon-button {
      width: 43px;
      height: 43px;
      padding: 0;
      font-size: 20px;
      background: #292d38;
    }

    .icon-button:hover {
      background: #3b4050;
    }

    #chatScreen {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      margin-bottom: 12px;
      padding: 10px 13px;
      border-radius: 12px;
      background: #20232b;
      overflow-wrap: anywhere;
    }

    .message strong {
      color: #8d99ff;
      display: block;
      margin-bottom: 4px;
    }

    .chat-input-row {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #191c24;
    }

    .chat-input-row input {
      flex: 1;
    }

    .panel {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #101218;
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      height: 60px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: #191c24;
    }

    .panel-header h2 {
      font-size: 18px;
      margin: 0;
      flex: 1;
    }

    .panel-content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 15px;
    }

    .panel-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .panel-row input {
      flex: 1;
    }

    #gifResults {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
    }

    #gifResults img {
      width: 100%;
      border-radius: 10px;
      cursor: pointer;
    }

    #voiceScreen {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: #101218;
      display: flex;
      flex-direction: column;
    }

    #voiceScreen .panel-content {
      padding-bottom: 25px;
    }

    #voiceAudioContainer {
      display: none;
    }

    #voiceUsers,
    #voiceRoomUsers {
      margin: 12px 0;
    }

    #voiceChatPanel {
      margin-top: 15px;
    }

    #voiceMessages {
      max-height: 200px;
      overflow-y: auto;
    }

    .youtube-modal {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: #000b;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .youtube-box {
      position: relative;
      width: 100%;
      max-width: 800px;
      background: #191c24;
      padding: 15px;
      border-radius: 15px;
    }

    .youtube-close {
      position: absolute;
      right: 8px;
      top: 8px;
      z-index: 2;
      background: #d33;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      padding: 0;
    }

    #youtubeFrame {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      margin-top: 35px;
      background: black;
    }

    @media (max-width: 500px) {
      .brand {
        font-size: 17px;
      }

      .topbar {
        gap: 6px;
        padding: 7px;
      }

      .icon-button {
        width: 39px;
        height: 39px;
      }
    }
  </style>
</head>

<body>

  <!-- KAYIT EKRANI -->
  <section id="loginScreen">
    <div class="login-box">
      <h1>Chatbox</h1>
      <input id="usernameInput" maxlength="24" placeholder="Kullanıcı adın">
      <button id="joinButton">Sohbete Katıl</button>
    </div>
  </section>

  <!-- ANA SOHBET -->
  <main id="mainScreen" class="hidden">

    <header class="topbar">
      <div class="brand">Chatbox</div>

      <button id="openVoiceButton" class="icon-button" title="Sesli oda">🎙️</button>
      <button id="openGifButton" class="icon-button" title="GIF ara">GIF</button>
      <button id="openYoutubeButton" class="icon-button" title="YouTube">▶</button>
    </header>

    <section id="chatScreen">
      <div id="messages"></div>

      <div class="chat-input-row">
        <input id="messageInput" placeholder="Mesaj yaz..." autocomplete="off">
        <button id="sendButton">Gönder</button>
      </div>
    </section>
  </main>

  <!-- GIF EKRANI -->
  <section id="gifScreen" class="panel hidden">
    <header class="panel-header">
      <h2>GIF Ara</h2>
      <button class="icon-button" data-close="gifScreen">✕</button>
    </header>

    <div class="panel-content">
      <div class="panel-row">
        <input id="gifSearchInput" placeholder="GIF ara...">
        <button id="gifSearchButton">Ara</button>
      </div>

      <div id="gifResults"></div>
    </div>
  </section>

  <!-- SESLİ ODA EKRANI -->
  <section id="voiceScreen" class="hidden">
    <header class="panel-header">
      <h2 id="voiceRoomTitle">Sesli Oda</h2>
      <button class="icon-button" id="voiceLeaveButton">✕</button>
    </header>

    <div class="panel-content">
      <p id="voiceRoomStatus">Bir oda oluştur veya odaya katıl.</p>

      <div class="panel-row">
        <input id="voiceRoomNameInput" placeholder="Oda adı">
        <button id="voiceCreateButton">Oda Kur</button>
      </div>

      <div class="panel-row">
        <input id="voiceJoinRoomInput" placeholder="Katılacağın oda">
        <button id="voiceJoinButton">Katıl</button>
      </div>

      <div id="voiceRoomUsers"></div>

      <div class="panel-row">
        <button id="voiceMuteButton">Mikrofonu Kapat</button>
        <button id="voiceChatToggleButton">Oda Sohbeti</button>
      </div>

      <div id="voiceChatPanel" class="hidden">
        <div id="voiceMessages"></div>

        <div class="panel-row">
          <input id="voiceMessageInput" placeholder="Odaya mesaj yaz...">
          <button id="voiceMessageSendButton">Gönder</button>
        </div>
      </div>

      <div id="voiceAudioContainer"></div>
    </div>
  </section>

  <!-- YOUTUBE URL GİRİŞİ -->
  <section id="youtubeInputModal" class="youtube-modal hidden">
    <div class="youtube-box">
      <button class="youtube-close" id="youtubeCancelButton">✕</button>
      <h3>YouTube videosu</h3>

      <div class="panel-row">
        <input id="youtubeUrlInput" placeholder="YouTube video URL'si">
        <button id="youtubePlayButton">Oynat</button>
      </div>
    </div>
  </section>

  <!-- YOUTUBE VİDEO -->
  <section id="youtubeModal" class="youtube-modal hidden">
    <div class="youtube-box">
      <button class="youtube-close" id="youtubeCloseButton">✕</button>
      <iframe
        id="youtubeFrame"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>
  </section>

  <audio id="joinSound" src="/sounds/room-open.mp3" preload="auto"></audio>
  <audio id="leaveSound" src="/sounds/room-close.mp3" preload="auto"></audio>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
  <script src="voice.js"></script>
</body>
</html>
