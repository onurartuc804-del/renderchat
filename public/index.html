
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbox</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .panel {
      background: #1f2937;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }

    h1, h2 {
      margin-top: 0;
    }

    input, button {
      padding: 12px;
      border-radius: 8px;
      border: none;
      margin: 5px 0;
      font-size: 15px;
    }

    input {
      width: 100%;
      background: #374151;
      color: white;
    }

    button {
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .danger {
      background: #dc2626;
    }

    .hidden {
      display: none !important;
    }

    #messages {
      height: 250px;
      overflow-y: auto;
      background: #111827;
      border-radius: 8px;
      padding: 10px;
      margin: 10px 0;
    }

    .message {
      padding: 8px;
      margin-bottom: 6px;
      background: #374151;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }

    #gifResults {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .gif-result {
      background: #374151;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
    }

    .gif-result img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      display: block;
    }

    #voiceRoomUsers {
      padding: 10px;
      background: #111827;
      border-radius: 8px;
      margin: 10px 0;
    }

    #voiceMessages {
      height: 150px;
      overflow-y: auto;
      background: #111827;
      padding: 10px;
      border-radius: 8px;
      margin: 10px 0;
    }

    audio {
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- Giriş ekranı -->
    <section id="loginScreen" class="panel">
      <h1>Chatbox</h1>
      <input id="usernameInput" placeholder="Kullanıcı adın">
      <button id="joinButton">Sohbete Katıl</button>
    </section>

    <!-- Genel sohbet -->
    <section id="chatScreen" class="panel hidden">
      <h2>Genel Sohbet</h2>

      <div id="messages"></div>

      <input id="messageInput" placeholder="Mesajını yaz...">
      <button id="sendButton">Gönder</button>

      <h3>GIF Ara</h3>
      <input id="gifSearchInput" placeholder="GIF ara...">
      <button id="gifSearchButton">Ara</button>

      <div id="gifResults"></div>
    </section>

    <!-- Sesli sohbet -->
    <section id="voiceScreen" class="panel hidden">
      <h2>Sesli Odalar</h2>

      <input
        id="voiceRoomNameInput"
        placeholder="Oda adı veya oda sahibinin adı"
      >

      <button id="voiceCreateButton">
        Oda Oluştur
      </button>

      <button id="voiceJoinButton">
        Odaya Katıl
      </button>

      <h3 id="voiceRoomTitle">Henüz bir odada değilsin</h3>

      <p id="voiceRoomStatus">Bağlantı bekleniyor</p>

      <div id="voiceRoomUsers">
        Odada kimse yok
      </div>

      <button id="voiceMuteButton">
        Mikrofonu Kapat
      </button>

      <button id="voiceChatToggleButton">
        Oda Sohbeti
      </button>

      <button id="voiceLeaveButton" class="danger">
        Odadan Çık
      </button>

      <div id="voiceChatPanel" class="hidden">
        <h3>Oda Mesajları</h3>

        <div id="voiceMessages"></div>

        <input
          id="voiceMessageInput"
          placeholder="Odaya mesaj yaz..."
        >

        <button id="voiceMessageSendButton">
          Gönder
        </button>
      </div>

      <div id="voiceAudioContainer"></div>
    </section>

  </div>

  <!-- Oda açılma ve kapanma sesleri -->
  <audio
    id="joinSound"
    preload="auto"
    src="/sounds/room-open.mp3"
  ></audio>

  <audio
    id="leaveSound"
    preload="auto"
    src="/sounds/room-close.mp3"
  ></audio>

  <!-- Scriptler -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
  <script src="voice.js"></script>
</body>
</html>
